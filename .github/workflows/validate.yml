name: Validate Resource Database

on:
  push:
    paths:
      - 'data/**'
  pull_request:
    paths:
      - 'data/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for f in Path("data").glob("*.json"):
              json.loads(f.read_text())
              print("Valid:", f)
          PY
