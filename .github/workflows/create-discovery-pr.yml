name: Create Resource Discovery PR

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create discovery branch
        run: |
          BRANCH="resource-discovery-$(date +%Y%m%d-%H%M%S)"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git checkout -b "$BRANCH"

      - name: Run discovery
        run: |
          python3 scripts/discovery/discover.py

      - name: Check candidates
        id: candidates
        run: |
          COUNT=$(python3 - <<'PY'
          import json

          with open("data/proposals/candidates.json", encoding="utf-8") as f:
              data = json.load(f)

          print(len(data.get("candidates", [])))
          PY
          )

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Discovered $COUNT candidates."

      - name: Commit candidates
        if: steps.candidates.outputs.count != '0'
        run: |
          git config user.name "MILEYM3DIA Discovery Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/proposals/candidates.json

          git commit \
            -m "🤖 Discover new creator resources"

          git push --set-upstream origin "$BRANCH"

      - name: Create Pull Request
        if: steps.candidates.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "🤖 Review newly discovered creator resources" \
            --body "## MILEYM3DIA Creator Hub

          The free discovery engine found **${{ steps.candidates.outputs.count }}** potential resources.

          ### ⚠️ Nothing has been published automatically

          Please review each candidate before promoting it into:

          \`data/resources.json\`

          ### Review checklist

          - [ ] Resource is relevant
          - [ ] Website is legitimate
          - [ ] Resource isn't already listed
          - [ ] Category is appropriate
          - [ ] Description is accurate
          - [ ] Pricing is accurate
          - [ ] Platform information is accurate
          - [ ] Download links are legitimate

          **Discovery is automated. Publication remains human-approved.**
          "

      - name: No candidates
        if: steps.candidates.outputs.count == '0'
        run: |
          echo "No new resources were discovered."
