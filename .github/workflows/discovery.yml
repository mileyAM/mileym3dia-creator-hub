name: MILEYM3DIA Free Resource Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discover candidates
        run: python3 scripts/discovery/discover.py

      - name: Show discovery results
        run: |
          cat data/proposals/candidates.json

      - name: Commit candidates
        run: |
          git config user.name "MILEYM3DIA Discovery"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/proposals/candidates.json

          if git diff --cached --quiet; then
            echo "No new candidates."
          else
            git commit -m "Update resource discovery candidates"
            git push
          fi
